<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Шрифти: General Sans (UI) + Averia Serif Libre (акцентний курсив) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;1,300;1,400;1,700&display=swap"
    />

    <title>TANGIZ — травматологія та ортопедія</title>
    <meta
      name="description"
      content="Консультація хірурга, травматолога-ортопеда Тенгіза Дадвані в Києві. Біль у суглобах, травми, переломи — онлайн-запис за хвилину."
    />
    <meta name="theme-color" content="#4f7cff" />

    <!-- Прев'ю посилання в Telegram, Viber, Facebook, Instagram тощо (Open Graph).
         Месенджери вимагають повну адресу картинки — домен береться з VITE_SITE_URL (.env). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TANGIZ" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Тенгіз Дадвані — хірург, травматолог-ортопед" />
    <meta
      property="og:description"
      content="Біль, травма чи перелом? Розберемося на консультації. Онлайн-запис за хвилину."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TANGIZ — консультація травматолога-ортопеда Тенгіза Дадвані" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
